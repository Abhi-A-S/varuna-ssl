[project]
name = "varuna-ssl"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.15"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
download-dataset = "scripts.download_dataset:main"
verify-images = "scripts.validate_images:main"
analyze-dataset = "scripts.analyze_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
